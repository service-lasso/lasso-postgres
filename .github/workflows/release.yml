name: Release

on:
  pull_request:
    branches: [develop]
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified development candidate
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            postgres-version: "15.17"
            artifact: dist/lasso-postgres-15.17-win32.zip
          - os: macos-15-intel
            platform: darwin
            postgres-version: "15.17"
            artifact: dist/lasso-postgres-15.17-darwin.tar.gz
          - os: ubuntu-22.04
            platform: linux
            postgres-version: "15.17"
            artifact: dist/lasso-postgres-15.17-linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential libreadline-dev zlib1g-dev

      - name: Verify package
        run: npm test
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          POSTGRES_VERSION: ${{ matrix.postgres-version }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: lasso-postgres-${{ matrix.postgres-version }}-${{ matrix.platform }}
          path: ${{ matrix.artifact }}

      - name: Upload verify output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.postgres-version }}-${{ matrix.platform }}
          path: output/verify
          if-no-files-found: warn

  release:
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'workflow_dispatch' && inputs.publish
    environment: development-service
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: lasso-postgres-*
          merge-multiple: true

      - name: Compute release version
        id: version
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          version="$(date -u +%Y.%-m.%-d)-${short_sha}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Copy service manifest into release assets
        env:
          LASSO_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = process.env.LASSO_RELEASE_VERSION;
          const manifest = JSON.parse(fs.readFileSync('service.json', 'utf8'));
          manifest.version = version;
          manifest.artifact.source.tag = version;
          delete manifest.artifact.source.channel;
          fs.writeFileSync('release-assets/service.json', JSON.stringify(manifest, null, 2) + '\n');
          fs.writeFileSync('release-assets/source.json', JSON.stringify({repo: process.env.GITHUB_REPOSITORY, sourceSha: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, tag: version}, null, 2) + '\n');
          NODE

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum \
            lasso-postgres-15.17-win32.zip \
            lasso-postgres-15.17-darwin.tar.gz \
            lasso-postgres-15.17-linux.tar.gz \
            service.json \
            source.json \
            > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/lasso-postgres-15.17-win32.zip
            release-assets/lasso-postgres-15.17-darwin.tar.gz
            release-assets/lasso-postgres-15.17-linux.tar.gz
            release-assets/service.json
            release-assets/SHA256SUMS.txt
            release-assets/source.json
          prerelease: true
          generate_release_notes: true
